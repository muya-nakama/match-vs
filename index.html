<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Match-3 Battle Firebase Test</title>
  <style>
    :root{
      --bg:#10141a;
      --panel:#1a212b;
      --text:#f5f7fa;
      --sub:#aeb8c5;
      --ok:#62d394;
      --warn:#ffd166;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .app{
      width:min(100%,520px);
      padding:24px 16px 48px;
    }
    .card{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.28);
    }
    h1{
      margin:0 0 8px;
      font-size:22px;
    }
    .sub{
      color:var(--sub);
      font-size:13px;
      line-height:1.7;
      margin-bottom:18px;
    }
    .row{
      background:#101720;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:12px;
      margin:10px 0;
    }
    .label{
      color:var(--sub);
      font-size:12px;
      margin-bottom:5px;
    }
    .value{
      font-weight:800;
      word-break:break-all;
    }
    .status.ok{color:var(--ok)}
    .status.warn{color:var(--warn)}
    .status.bad{color:var(--danger)}
    button{
      width:100%;
      margin-top:14px;
      padding:14px 16px;
      border:0;
      border-radius:13px;
      background:#f2f5f8;
      color:#17202a;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }
    .room{
      margin-top:18px;
      padding:18px 12px;
      text-align:center;
      border-radius:16px;
      background:#0d131b;
      border:1px solid rgba(255,255,255,.1);
      display:none;
    }
    .room.show{display:block}
    .roomLabel{
      color:var(--sub);
      font-size:12px;
      margin-bottom:4px;
    }
    .roomCode{
      font-size:42px;
      font-weight:1000;
      letter-spacing:.16em;
      padding-left:.16em;
    }
    .message{
      margin-top:14px;
      min-height:24px;
      color:var(--sub);
      font-size:13px;
      line-height:1.6;
    }


    .playerNameSetup{
      margin:14px 0 18px;
      padding:14px;
      border-radius:14px;
      background:#101720;
      border:1px solid rgba(255,255,255,.08);
    }
    .playerNameSetupLabel{
      color:var(--sub);
      font-size:12px;
      margin-bottom:7px;
    }
    .playerNameSetupRow{
      display:flex;
      gap:8px;
    }
    .playerNameSetupInput{
      min-width:0;
      flex:1;
      padding:11px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:#0b1016;
      color:#fff;
      font-size:15px;
    }
    .playerNameSetupSave{
      width:auto;
      margin-top:0;
      padding:11px 14px;
      white-space:nowrap;
    }
    .playerNameSetupStatus{
      min-height:18px;
      margin-top:7px;
      color:var(--sub);
      font-size:11px;
    }

    .lobbySummary{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
      color:var(--sub);
      font-size:13px;
    }
    .readyCount{
      font-weight:900;
      color:var(--text);
    }
    .playerGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px 10px;
      margin-top:12px;
    }
    .playerSlot{
      min-width:0;
      text-align:center;
    }
    .avatarWrap{
      position:relative;
      width:74px;
      height:74px;
      margin:0 auto 8px;
    }
    .avatarCircle{
      width:74px;
      height:74px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#17202b;
      border:2px solid rgba(255,255,255,.12);
      font-size:24px;
      font-weight:1000;
      letter-spacing:.02em;
      overflow:hidden;
    }
    .avatarCircle.empty{
      opacity:.28;
      border-style:dashed;
      font-size:18px;
      color:var(--sub);
    }
    .hostFlag{
      position:absolute;
      left:-2px;
      top:-2px;
      width:24px;
      height:24px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#14384a;
      color:#74d4ff;
      font-size:14px;
      border:2px solid var(--panel);
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }
    .readyCheck{
      position:absolute;
      right:-2px;
      bottom:-2px;
      width:24px;
      height:24px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#1c7f49;
      color:#fff;
      font-size:15px;
      font-weight:1000;
      border:2px solid var(--panel);
      box-shadow:0 2px 8px rgba(0,0,0,.35);
    }
    .playerName{
      font-size:13px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .playerMe{
      color:var(--sub);
      font-size:11px;
      margin-top:2px;
      min-height:15px;
    }

    code{
      background:#0b1016;
      border-radius:6px;
      padding:2px 5px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Match-3 Battle 接続テスト</h1>
      <div style="color:#7f8da0;font-size:11px;margin:-2px 0 10px">build: lobby-name-edit-01</div>
      <div class="sub">
        Firebase接続・6桁ルーム・6人ロビー・プレイヤー名同期・準備・開始直前・退出／ホスト引き継ぎを確認するテストページです。
      </div>

      <div class="row">
        <div class="label">Firebase</div>
        <div id="firebaseStatus" class="value status warn">初期化中…</div>
      </div>

      <div class="row">
        <div class="label">匿名ログイン</div>
        <div id="authStatus" class="value status warn">待機中…</div>
      </div>

      <div class="row">
        <div class="label">UID</div>
        <div id="uid" class="value">—</div>
      </div>

      <div class="playerNameSetup">
        <div class="playerNameSetupLabel">プレイヤーネーム</div>
        <div class="playerNameSetupRow">
          <input id="battlePlayerNameInput" class="playerNameSetupInput" maxlength="16" autocomplete="nickname" placeholder="名前を入力">
          <button id="battlePlayerNameSave" class="playerNameSetupSave" type="button">保存</button>
        </div>
        <div id="battlePlayerNameStatus" class="playerNameSetupStatus"></div>
      </div>

      <button id="createRoomBtn" type="button" disabled>6桁の部屋を作る</button>

      <div class="row" style="margin-top:18px">
        <div class="label">部屋番号を入力して参加</div>
        <input id="joinCodeInput" inputmode="numeric" maxlength="6"
               placeholder="6桁の部屋番号を入力"
               style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b1016;color:#fff;font-size:18px;letter-spacing:.08em;margin-top:6px">
        <button id="joinRoomBtn" type="button" disabled>この部屋に参加</button>
      </div>

      <div id="roomBox" class="room">
        <div class="roomLabel">現在の部屋番号</div>
        <div id="roomCode" class="roomCode">------</div>
        <button id="copyRoomBtn" type="button" style="margin-top:12px">ルームIDをコピー</button>
      </div>

      <div id="playersBox" class="row" style="display:none;margin-top:18px">
        <div class="lobbySummary">
          <span>参加者</span>
          <span id="readyCount" class="readyCount">準備完了 0/0</span>
        </div>
        <div id="playersList" class="playerGrid"></div>
      </div>

      <button id="readyBtn" type="button" disabled style="display:none">準備</button>
      <button id="startBattleBtn" type="button" disabled style="display:none">開始（0/0）</button>
      <button id="leaveRoomBtn" type="button" disabled style="display:none">ゲーム終了</button>

      <div id="countdownBox" class="room" style="margin-top:18px">
        <div class="roomLabel">開始カウントダウン</div>
        <div id="countdownText" class="roomCode">—</div>
      </div>

      <div id="message" class="message"></div>
    </section>
  </main>

  <!-- Firebase SDK（互換版。単体HTMLで扱いやすい方式） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6zij-aWSCb7k8C-DrrcbBcQ0mO3bHl-M",
      authDomain: "match3-battle-53092.firebaseapp.com",
      databaseURL: "https://match3-battle-53092-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "match3-battle-53092",
      storageBucket: "match3-battle-53092.firebasestorage.app",
      messagingSenderId: "980764398973",
      appId: "1:980764398973:web:1db93bb561942e6fa52814"
    };

    const firebaseStatus = document.getElementById("firebaseStatus");
    const authStatus = document.getElementById("authStatus");
    const uidEl = document.getElementById("uid");
    const battlePlayerNameInput = document.getElementById("battlePlayerNameInput");
    const battlePlayerNameSave = document.getElementById("battlePlayerNameSave");
    const battlePlayerNameStatus = document.getElementById("battlePlayerNameStatus");
    const createRoomBtn = document.getElementById("createRoomBtn");
    const joinRoomBtn = document.getElementById("joinRoomBtn");
    const joinCodeInput = document.getElementById("joinCodeInput");
    const roomBox = document.getElementById("roomBox");
    const roomCodeEl = document.getElementById("roomCode");
    const copyRoomBtn = document.getElementById("copyRoomBtn");
    const playersBox = document.getElementById("playersBox");
    const playersList = document.getElementById("playersList");
    const readyCount = document.getElementById("readyCount");
    const readyBtn = document.getElementById("readyBtn");
    const startBattleBtn = document.getElementById("startBattleBtn");
    const leaveRoomBtn = document.getElementById("leaveRoomBtn");
    const countdownBox = document.getElementById("countdownBox");
    const countdownText = document.getElementById("countdownText");
    const messageEl = document.getElementById("message");

    let currentUser = null;
    let currentRoomCode = null;
    let currentRoomRef = null;
    let currentRoomData = null;
    let serverTimeOffset = 0;
    let countdownTimer = null;

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function randomRoomCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    const PLAYER_NAME_KEY = "match3_ranking_name";

    function getLocalPlayerName() {
      return (localStorage.getItem(PLAYER_NAME_KEY) || "").trim().slice(0, 16);
    }

    function saveLocalPlayerName(name) {
      const clean = String(name || "").trim().slice(0, 16);
      if (clean) localStorage.setItem(PLAYER_NAME_KEY, clean);
      else localStorage.removeItem(PLAYER_NAME_KEY);
      return clean;
    }

    function syncBattlePlayerNameUI() {
      const saved = getLocalPlayerName();
      battlePlayerNameInput.value = saved;
      battlePlayerNameStatus.textContent = saved
        ? `保存済み: ${saved}`
        : "プレイヤーネームを入力してください";
      refreshEntryButtons();
    }

    function refreshEntryButtons() {
      const hasName = !!getLocalPlayerName();
      const authReady = !!currentUser;
      createRoomBtn.disabled = !(hasName && authReady);
      joinRoomBtn.disabled = !(hasName && authReady);
    }

    function saveBattlePlayerName() {
      const clean = saveLocalPlayerName(battlePlayerNameInput.value);
      battlePlayerNameStatus.textContent = clean
        ? `「${clean}」で保存しました`
        : "名前が未設定です";
      refreshEntryButtons();
      return clean;
    }

    function roomPlayerData(name, joinOrder) {
      return {
        name,
        ready: false,
        connected: true,
        score: 0,
        joinOrder,
        joinedAt: firebase.database.ServerValue.TIMESTAMP
      };
    }

    function playerCount(room) {
      return room && room.players ? Object.keys(room.players).length : 0;
    }

    function allPlayersReady(room) {
      if (!room || !room.players) return false;
      const entries = Object.entries(room.players);
      if (entries.length < 2) return false;

      return entries.every(([uid, p]) => {
        if (uid === room.hostUid) return true;
        return !!(p && p.ready === true);
      });
    }

    function isHost(room) {
      return !!(room && currentUser && room.hostUid === currentUser.uid);
    }

    function displayName(name) {
      const text = String(name || "Player");
      const chars = Array.from(text);
      return chars.length <= 5 ? text : chars.slice(0, 4).join("") + "…";
    }

    function avatarText(name) {
      const chars = Array.from(String(name || "?"));
      return chars.slice(0, 2).join("");
    }

    function renderPlayers(room) {
      const players = (room && room.players) || {};
      const entries = Object.entries(players).sort((a, b) => {
        const ao = Number(a[1] && a[1].joinOrder) || Number.MAX_SAFE_INTEGER;
        const bo = Number(b[1] && b[1].joinOrder) || Number.MAX_SAFE_INTEGER;
        return ao - bo;
      });

      const readyTotal = entries.filter(([uid, p]) => uid === room.hostUid || (p && p.ready === true)).length;
      readyCount.textContent = `準備完了 ${readyTotal}/${entries.length}`;

      const slots = [];

      entries.slice(0, 6).forEach(([uid, p]) => {
        const rawName = p && p.name ? p.name : "Player";
        const shownName = displayName(rawName);
        const hostBadge = room.hostUid === uid ? '<span class="hostFlag" title="ホスト">⚑</span>' : '';
        const readyBadge = p && p.ready ? '<span class="readyCheck" title="準備完了">✓</span>' : '';
        const meLabel = currentUser && currentUser.uid === uid ? '自分' : '&nbsp;';

        slots.push(`
          <div class="playerSlot">
            <div class="avatarWrap">
              <div class="avatarCircle">${avatarText(rawName)}</div>
              ${hostBadge}
              ${readyBadge}
            </div>
            <div class="playerName">${shownName}</div>
            <div class="playerMe">${meLabel}</div>
          </div>
        `);
      });

      for (let i = slots.length; i < 6; i++) {
        slots.push(`
          <div class="playerSlot">
            <div class="avatarWrap">
              <div class="avatarCircle empty">＋</div>
            </div>
            <div class="playerName">&nbsp;</div>
            <div class="playerMe">&nbsp;</div>
          </div>
        `);
      }

      playersList.innerHTML = slots.join("");
      playersBox.style.display = "block";
    }

    function updateLobbyButtons(room) {
      if (!currentUser || !room) return;

      const me = room.players && room.players[currentUser.uid];
      const waiting = room.status === "waiting";
      const total = playerCount(room);
      const readyTotal = room.players
        ? Object.entries(room.players).filter(([uid, p]) => uid === room.hostUid || (p && p.ready === true)).length
        : 0;

      leaveRoomBtn.style.display = "block";
      leaveRoomBtn.disabled = !me;
      leaveRoomBtn.textContent = "ゲーム終了";

      if (isHost(room)) {
        readyBtn.style.display = "none";

        startBattleBtn.style.display = "block";
        startBattleBtn.textContent = `開始（${readyTotal}/${total}）`;

        const canStart =
          waiting &&
          total >= 2 &&
          total <= 6 &&
          readyTotal === total;

        startBattleBtn.disabled = !canStart;
      } else {
        startBattleBtn.style.display = "none";

        readyBtn.style.display = "block";
        readyBtn.disabled = !me || !waiting;
        readyBtn.textContent = me && me.ready ? "準備解除" : "準備";
      }
    }

    function runCountdown(startAt) {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      countdownBox.classList.add("show");

      function tick() {
        const now = Date.now() + serverTimeOffset;
        const remain = startAt - now;

        if (remain <= 0) {
          countdownText.textContent = "START!";
          setMessage("開始時刻に到達しました。ここから先で実際のゲーム画面へ切り替える予定です。");
          clearInterval(countdownTimer);
          countdownTimer = null;
          return;
        }

        const sec = Math.ceil(remain / 1000);
        countdownText.textContent = String(sec);
      }

      tick();
      countdownTimer = setInterval(tick, 100);
    }

    function stopCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      countdownText.textContent = "—";
      countdownBox.classList.remove("show");
    }

    function watchRoom(code) {
      if (currentRoomRef) currentRoomRef.off();

      currentRoomRef = firebase.database().ref("rooms/" + code);
      currentRoomRef.on("value", snap => {
        if (!snap.exists()) {
          currentRoomData = null;
          setMessage("この部屋は削除されました。");
          return;
        }

        const room = snap.val();
        currentRoomData = room;

        renderPlayers(room);
        updateLobbyButtons(room);

        if (room.status === "countdown" && Number(room.startAt)) {
          runCountdown(Number(room.startAt));
        } else if (room.status === "waiting") {
          stopCountdown();
        }
      });
    }

    function showRoom(code, message) {
      currentRoomCode = code;
      roomCodeEl.textContent = code;
      roomBox.classList.add("show");
      readyBtn.style.display = "block";
      leaveRoomBtn.style.display = "block";
      watchRoom(code);
      setMessage(message);
    }

    async function createUniqueRoom(uid) {
      const db = firebase.database();

      for (let attempt = 0; attempt < 20; attempt++) {
        const code = randomRoomCode();
        const roomRef = db.ref("rooms/" + code);

        const result = await roomRef.transaction(current => {
          if (current !== null) return;

          return {
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            status: "waiting",
            hostUid: uid,
            startAt: null,
            nextJoinOrder: 1,
            players: {
              [uid]: roomPlayerData(getLocalPlayerName() || "ゲスト", 1)
            }
          };
        });

        if (result.committed) {
          // UI版でもホストが必ず1人目として入室済みになるよう明示的に保証する。
          const hostPlayerRef = roomRef.child("players/" + uid);
          const hostSnap = await hostPlayerRef.once("value");

          if (!hostSnap.exists()) {
            await hostPlayerRef.set(roomPlayerData(getLocalPlayerName() || "ゲスト", 1));
          }

          // ホスト情報と入室順カウンタも念のため保証。
          await roomRef.update({
            hostUid: uid,
            nextJoinOrder: 1
          });

          return code;
        }
      }

      throw new Error("空いている部屋番号を作成できませんでした。");
    }

    async function joinRoom(code, uid) {
      if (!/^\d{6}$/.test(code)) {
        throw new Error("部屋番号は6桁の数字で入力してください。");
      }

      const roomRef = firebase.database().ref("rooms/" + code);

      // 1. まずサーバーから部屋を明示的に取得
      const initialSnap = await roomRef.once("value");

      if (!initialSnap.exists()) {
        throw new Error("その部屋は見つかりません。");
      }

      const initialRoom = initialSnap.val() || {};

      if (initialRoom.status !== "waiting") {
        throw new Error("その部屋は参加受付中ではありません。");
      }

      const initialPlayers = initialRoom.players || {};

      // 同じUIDですでに入室済みなら、そのまま成功扱い
      if (initialPlayers[uid]) {
        return code;
      }

      if (Object.keys(initialPlayers).length >= 6) {
        throw new Error("この部屋は6人で満員です。");
      }

      // 2. 入室順位だけを独立したtransactionで採番
      // whole-room transactionを避け、別ブラウザ初回参加時のnull誤判定を防ぐ
      const orderRef = roomRef.child("nextJoinOrder");
      const orderResult = await orderRef.transaction(current => {
        const n = Number(current);
        return Number.isFinite(n) && n >= 0 ? n + 1 : 1;
      });

      if (!orderResult.committed) {
        throw new Error("入室順位の取得に失敗しました。");
      }

      const newOrder = Number(orderResult.snapshot.val());

      // 3. 採番中に部屋が閉じられていないか再確認
      const latestSnap = await roomRef.once("value");

      if (!latestSnap.exists()) {
        throw new Error("参加処理中に部屋が閉じられました。");
      }

      const latestRoom = latestSnap.val() || {};

      if (latestRoom.status !== "waiting") {
        throw new Error("その部屋は参加受付中ではありません。");
      }

      const latestPlayers = latestRoom.players || {};

      if (latestPlayers[uid]) {
        return code;
      }

      if (Object.keys(latestPlayers).length >= 6) {
        throw new Error("この部屋は6人で満員です。");
      }

      // 4. 自分のプレイヤーデータだけを書き込む
      await roomRef.child("players/" + uid).set(
        roomPlayerData(getLocalPlayerName() || "ゲスト", newOrder)
      );

      return code;
    }

    async function leaveRoom(code, uid) {
      const roomRef = firebase.database().ref("rooms/" + code);
      let roomDeleted = false;
      let newHostUid = null;

      const result = await roomRef.transaction(room => {
        if (room === null) {
          roomDeleted = true;
          return null;
        }

        room.players = room.players || {};

        if (!room.players[uid]) {
          return room;
        }

        delete room.players[uid];

        const remainingEntries = Object.entries(room.players);

        if (remainingEntries.length === 0) {
          roomDeleted = true;
          return null;
        }

        if (room.hostUid === uid || !room.players[room.hostUid]) {
          remainingEntries.sort((a, b) => {
            const ao = Number(a[1] && a[1].joinOrder) || Number.MAX_SAFE_INTEGER;
            const bo = Number(b[1] && b[1].joinOrder) || Number.MAX_SAFE_INTEGER;
            return ao - bo;
          });

          newHostUid = remainingEntries[0][0];
          room.hostUid = newHostUid;
        }

        return room;
      });

      if (!result.committed && !roomDeleted) {
        throw new Error("退出処理に失敗しました。");
      }

      return { roomDeleted, newHostUid };
    }

    function resetLobbyUI() {
      if (currentRoomRef) {
        currentRoomRef.off();
        currentRoomRef = null;
      }

      currentRoomCode = null;
      currentRoomData = null;

      roomCodeEl.textContent = "------";
      roomBox.classList.remove("show");

      playersList.innerHTML = "";
      readyCount.textContent = "準備完了 0/0";
      playersBox.style.display = "none";

      readyBtn.style.display = "none";
      readyBtn.disabled = true;

      startBattleBtn.style.display = "none";
      startBattleBtn.disabled = true;

      leaveRoomBtn.style.display = "none";
      leaveRoomBtn.disabled = true;

      stopCountdown();

      joinCodeInput.value = "";
      refreshEntryButtons();
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    async function start() {
      try {
        firebase.initializeApp(firebaseConfig);
        firebaseStatus.textContent = "接続設定 OK";
        firebaseStatus.className = "value status ok";

        firebase.database().ref(".info/serverTimeOffset").on("value", snap => {
          serverTimeOffset = Number(snap.val()) || 0;
        });

        authStatus.textContent = "匿名ログイン中…";
        authStatus.className = "value status warn";

        const credential = await firebase.auth().signInAnonymously();
        const user = credential.user;
        currentUser = user;

        authStatus.textContent = "匿名ログイン成功";
        authStatus.className = "value status ok";
        uidEl.textContent = user.uid;

        refreshEntryButtons();
        setMessage("準備完了。名前を確認して、部屋を作るか6桁番号を入力して参加してください。");

        battlePlayerNameSave.addEventListener("click", () => {
          saveBattlePlayerName();
        });

        battlePlayerNameInput.addEventListener("keydown", e => {
          if (e.key === "Enter") saveBattlePlayerName();
        });

        battlePlayerNameInput.addEventListener("input", () => {
          battlePlayerNameStatus.textContent = "変更する場合は保存してください";
        });

        createRoomBtn.addEventListener("click", async () => {
          if (!getLocalPlayerName()) {
            setMessage("プレイヤーネームを保存してから部屋を作ってください。");
            return;
          }
          createRoomBtn.disabled = true;
          joinRoomBtn.disabled = true;
          setMessage("部屋を作成しています…");

          try {
            const code = await createUniqueRoom(user.uid);
            showRoom(code, "部屋を作成しました。ルームIDを共有して参加者を待ってください。");
          } catch (err) {
            console.error(err);
            setMessage("部屋作成に失敗しました: " + (err && err.message ? err.message : err));
          } finally {
            createRoomBtn.disabled = false;
            joinRoomBtn.disabled = false;
          }
        });

        joinRoomBtn.addEventListener("click", async () => {
          if (!getLocalPlayerName()) {
            setMessage("プレイヤーネームを保存してから参加してください。");
            return;
          }
          const code = joinCodeInput.value.trim();
          createRoomBtn.disabled = true;
          joinRoomBtn.disabled = true;
          setMessage("部屋へ参加しています…");

          try {
            const joinedCode = await joinRoom(code, user.uid);
            showRoom(joinedCode, "部屋 " + joinedCode + " に参加しました。");
          } catch (err) {
            console.error(err);
            setMessage("参加に失敗しました: " + (err && err.message ? err.message : err));
          } finally {
            createRoomBtn.disabled = false;
            joinRoomBtn.disabled = false;
          }
        });

        copyRoomBtn.addEventListener("click", async () => {
          if (!currentRoomCode) return;

          try {
            await copyText(currentRoomCode);
            setMessage("ルームID " + currentRoomCode + " をコピーしました。");
          } catch (err) {
            console.error(err);
            setMessage("コピーに失敗しました。ルームIDは " + currentRoomCode + " です。");
          }
        });

        leaveRoomBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentUser) return;

          const leavingCode = currentRoomCode;
          leaveRoomBtn.disabled = true;
          readyBtn.disabled = true;
          startBattleBtn.disabled = true;
          setMessage("部屋から退出しています…");

          try {
            const result = await leaveRoom(leavingCode, currentUser.uid);
            resetLobbyUI();

            if (result.roomDeleted) {
              setMessage("退出しました。参加者が0人になったため、部屋 " + leavingCode + " は削除されました。");
            } else if (result.newHostUid) {
              setMessage("退出しました。次の入室者へホストを引き継ぎました。");
            } else {
              setMessage("部屋 " + leavingCode + " から退出しました。");
            }
          } catch (err) {
            console.error(err);
            leaveRoomBtn.disabled = false;
            setMessage("退出に失敗しました: " + (err && err.message ? err.message : err));
          }
        });

        readyBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentRoomData || !currentUser) return;
          if (currentRoomData.status !== "waiting") return;

          const me = currentRoomData.players && currentRoomData.players[currentUser.uid];
          if (!me) return;

          try {
            await firebase.database()
              .ref("rooms/" + currentRoomCode + "/players/" + currentUser.uid + "/ready")
              .set(!me.ready);
          } catch (err) {
            console.error(err);
            setMessage("準備状態の更新に失敗しました。");
          }
        });

        startBattleBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentRoomData || !currentUser) return;
          if (!isHost(currentRoomData)) return;
          if (currentRoomData.status !== "waiting") return;
          if (playerCount(currentRoomData) < 2 || playerCount(currentRoomData) > 6) return;
          if (!allPlayersReady(currentRoomData)) return;

          const startAt = Date.now() + serverTimeOffset + 5000;

          try {
            await firebase.database().ref("rooms/" + currentRoomCode).update({
              status: "countdown",
              startAt
            });
            setMessage("開始カウントダウンを送信しました。");
          } catch (err) {
            console.error(err);
            setMessage("開始処理に失敗しました。");
          }
        });

      } catch (err) {
        console.error(err);
        firebaseStatus.textContent = "エラー";
        firebaseStatus.className = "value status bad";
        authStatus.textContent = "失敗";
        authStatus.className = "value status bad";
        setMessage("Firebase初期化または匿名ログインに失敗しました: " + (err && err.message ? err.message : err));
      }
    }

    syncBattlePlayerNameUI();
    start();
  </script>
</body>
</html>
