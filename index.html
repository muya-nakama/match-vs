<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Match-3 Battle Firebase Test</title>
  <style>
    :root{
      --bg:#10141a;
      --panel:#1a212b;
      --text:#f5f7fa;
      --sub:#aeb8c5;
      --ok:#62d394;
      --warn:#ffd166;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .app{
      width:min(100%,520px);
      padding:24px 16px 48px;
    }
    .card{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:18px;
      box-shadow:0 14px 40px rgba(0,0,0,.28);
    }
    h1{
      margin:0 0 8px;
      font-size:22px;
    }
    .sub{
      color:var(--sub);
      font-size:13px;
      line-height:1.7;
      margin-bottom:18px;
    }
    .row{
      background:#101720;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:12px;
      margin:10px 0;
    }
    .label{
      color:var(--sub);
      font-size:12px;
      margin-bottom:5px;
    }
    .value{
      font-weight:800;
      word-break:break-all;
    }
    .status.ok{color:var(--ok)}
    .status.warn{color:var(--warn)}
    .status.bad{color:var(--danger)}
    button{
      width:100%;
      margin-top:14px;
      padding:14px 16px;
      border:0;
      border-radius:13px;
      background:#f2f5f8;
      color:#17202a;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }
    .room{
      margin-top:18px;
      padding:18px 12px;
      text-align:center;
      border-radius:16px;
      background:#0d131b;
      border:1px solid rgba(255,255,255,.1);
      display:none;
    }
    .room.show{display:block}
    .roomLabel{
      color:var(--sub);
      font-size:12px;
      margin-bottom:4px;
    }
    .roomCode{
      font-size:42px;
      font-weight:1000;
      letter-spacing:.16em;
      padding-left:.16em;
    }
    .message{
      margin-top:14px;
      min-height:24px;
      color:var(--sub);
      font-size:13px;
      line-height:1.6;
    }
    code{
      background:#0b1016;
      border-radius:6px;
      padding:2px 5px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Match-3 Battle 接続テスト</h1>
      <div class="sub">
        Firebase接続・6桁ルーム・6人ロビー・準備・開始直前・退出／ホスト引き継ぎ・別ブラウザ参加を確認するテストページです。
      </div>

      <div class="row">
        <div class="label">Firebase</div>
        <div id="firebaseStatus" class="value status warn">初期化中…</div>
      </div>

      <div class="row">
        <div class="label">匿名ログイン</div>
        <div id="authStatus" class="value status warn">待機中…</div>
      </div>

      <div class="row">
        <div class="label">UID</div>
        <div id="uid" class="value">—</div>
      </div>

      <button id="createRoomBtn" type="button" disabled>6桁の部屋を作る</button>

      <div class="row" style="margin-top:18px">
        <div class="label">部屋番号を入力して参加</div>
        <input id="joinCodeInput" inputmode="numeric" maxlength="6"
               placeholder="6桁の部屋番号を入力"
               style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b1016;color:#fff;font-size:18px;letter-spacing:.08em;margin-top:6px">
        <button id="joinRoomBtn" type="button" disabled>この部屋に参加</button>
      </div>

      <div id="roomBox" class="room">
        <div class="roomLabel">現在の部屋番号</div>
        <div id="roomCode" class="roomCode">------</div>
        <button id="copyRoomBtn" type="button" style="margin-top:12px">ルームIDをコピー</button>
      </div>

      <div id="playersBox" class="row" style="display:none;margin-top:18px">
        <div class="label">参加者（2〜6人）</div>
        <div id="playersList" class="value">—</div>
      </div>

      <button id="readyBtn" type="button" disabled style="display:none">準備完了にする</button>
      <button id="startBattleBtn" type="button" disabled style="display:none">対戦開始</button>
      <button id="leaveRoomBtn" type="button" disabled style="display:none">ゲーム終了（退出）</button>

      <div id="countdownBox" class="room" style="margin-top:18px">
        <div class="roomLabel">開始カウントダウン</div>
        <div id="countdownText" class="roomCode">—</div>
      </div>

      <div id="message" class="message"></div>
    </section>
  </main>

  <!-- Firebase SDK（互換版。単体HTMLで扱いやすい方式） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6zij-aWSCb7k8C-DrrcbBcQ0mO3bHl-M",
      authDomain: "match3-battle-53092.firebaseapp.com",
      databaseURL: "https://match3-battle-53092-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "match3-battle-53092",
      storageBucket: "match3-battle-53092.firebasestorage.app",
      messagingSenderId: "980764398973",
      appId: "1:980764398973:web:1db93bb561942e6fa52814"
    };

    const firebaseStatus = document.getElementById("firebaseStatus");
    const authStatus = document.getElementById("authStatus");
    const uidEl = document.getElementById("uid");
    const createRoomBtn = document.getElementById("createRoomBtn");
    const joinRoomBtn = document.getElementById("joinRoomBtn");
    const joinCodeInput = document.getElementById("joinCodeInput");
    const roomBox = document.getElementById("roomBox");
    const roomCodeEl = document.getElementById("roomCode");
    const copyRoomBtn = document.getElementById("copyRoomBtn");
    const playersBox = document.getElementById("playersBox");
    const playersList = document.getElementById("playersList");
    const readyBtn = document.getElementById("readyBtn");
    const startBattleBtn = document.getElementById("startBattleBtn");
    const leaveRoomBtn = document.getElementById("leaveRoomBtn");
    const countdownBox = document.getElementById("countdownBox");
    const countdownText = document.getElementById("countdownText");
    const messageEl = document.getElementById("message");

    let currentUser = null;
    let currentRoomCode = null;
    let currentRoomRef = null;
    let currentRoomData = null;
    let serverTimeOffset = 0;
    let countdownTimer = null;

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function randomRoomCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function roomPlayerData(name, joinOrder) {
      return {
        name,
        ready: false,
        connected: true,
        score: 0,
        joinOrder,
        joinedAt: firebase.database.ServerValue.TIMESTAMP
      };
    }

    function playerCount(room) {
      return room && room.players ? Object.keys(room.players).length : 0;
    }

    function allPlayersReady(room) {
      if (!room || !room.players) return false;
      const players = Object.values(room.players);
      return players.length >= 2 && players.every(p => p && p.ready === true);
    }

    function isHost(room) {
      return !!(room && currentUser && room.hostUid === currentUser.uid);
    }

    function renderPlayers(room) {
      const players = (room && room.players) || {};
      const entries = Object.entries(players).sort((a, b) => {
        const ao = Number(a[1] && a[1].joinOrder) || Number.MAX_SAFE_INTEGER;
        const bo = Number(b[1] && b[1].joinOrder) || Number.MAX_SAFE_INTEGER;
        return ao - bo;
      });

      playersList.innerHTML = entries.length
        ? entries.map(([uid, p], i) => {
            const hostMark = room.hostUid === uid ? " 👑" : "";
            const meMark = currentUser && currentUser.uid === uid ? "（自分）" : "";
            const readyMark = p && p.ready ? "✅ 準備完了" : "⏳ 待機中";
            const label = p && p.name ? p.name : "Player";
            return `<div style="margin:8px 0">${i + 1}. ${label}${hostMark} ${meMark}<br><span style="font-size:13px;color:#aeb8c5">${readyMark}</span></div>`;
          }).join("")
        : "—";

      playersBox.style.display = "block";
    }

    function updateLobbyButtons(room) {
      if (!currentUser || !room) return;

      const me = room.players && room.players[currentUser.uid];
      const waiting = room.status === "waiting";

      readyBtn.style.display = "block";
      readyBtn.disabled = !me || !waiting;
      readyBtn.textContent = me && me.ready ? "準備完了を解除" : "準備完了にする";

      leaveRoomBtn.style.display = "block";
      leaveRoomBtn.disabled = !me;

      if (isHost(room)) {
        startBattleBtn.style.display = "block";
        const canStart = waiting && playerCount(room) >= 2 && playerCount(room) <= 6 && allPlayersReady(room);
        startBattleBtn.disabled = !canStart;

        if (playerCount(room) < 2) {
          startBattleBtn.textContent = "対戦開始（2人以上必要）";
        } else if (!allPlayersReady(room)) {
          startBattleBtn.textContent = "対戦開始（全員の準備待ち）";
        } else {
          startBattleBtn.textContent = "対戦開始";
        }
      } else {
        startBattleBtn.style.display = "none";
      }
    }

    function runCountdown(startAt) {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      countdownBox.classList.add("show");

      function tick() {
        const now = Date.now() + serverTimeOffset;
        const remain = startAt - now;

        if (remain <= 0) {
          countdownText.textContent = "START!";
          setMessage("開始時刻に到達しました。ここから先で実際のゲーム画面へ切り替える予定です。");
          clearInterval(countdownTimer);
          countdownTimer = null;
          return;
        }

        const sec = Math.ceil(remain / 1000);
        countdownText.textContent = String(sec);
      }

      tick();
      countdownTimer = setInterval(tick, 100);
    }

    function stopCountdown() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      countdownText.textContent = "—";
      countdownBox.classList.remove("show");
    }

    function watchRoom(code) {
      if (currentRoomRef) currentRoomRef.off();

      currentRoomRef = firebase.database().ref("rooms/" + code);
      currentRoomRef.on("value", snap => {
        if (!snap.exists()) {
          currentRoomData = null;
          setMessage("この部屋は削除されました。");
          return;
        }

        const room = snap.val();
        currentRoomData = room;

        renderPlayers(room);
        updateLobbyButtons(room);

        if (room.status === "countdown" && Number(room.startAt)) {
          runCountdown(Number(room.startAt));
        } else if (room.status === "waiting") {
          stopCountdown();
        }
      });
    }

    function showRoom(code, message) {
      currentRoomCode = code;
      roomCodeEl.textContent = code;
      roomBox.classList.add("show");
      readyBtn.style.display = "block";
      leaveRoomBtn.style.display = "block";
      watchRoom(code);
      setMessage(message);
    }

    async function createUniqueRoom(uid) {
      const db = firebase.database();

      for (let attempt = 0; attempt < 20; attempt++) {
        const code = randomRoomCode();
        const roomRef = db.ref("rooms/" + code);

        const result = await roomRef.transaction(current => {
          if (current !== null) return;

          return {
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            status: "waiting",
            hostUid: uid,
            startAt: null,
            nextJoinOrder: 1,
            players: {
              [uid]: roomPlayerData("HOST", 1)
            }
          };
        });

        if (result.committed) return code;
      }

      throw new Error("空いている部屋番号を作成できませんでした。");
    }

    async function joinRoom(code, uid) {
      if (!/^\d{6}$/.test(code)) {
        throw new Error("部屋番号は6桁の数字で入力してください。");
      }

      const roomRef = firebase.database().ref("rooms/" + code);

      // 先に明示的に部屋を取得する。
      // 新しいブラウザ/シークレットセッションで transaction の初回値が
      // ローカル未同期の null になるケースを避けるため。
      const initialSnap = await roomRef.once("value");

      if (!initialSnap.exists()) {
        throw new Error("その部屋は見つかりません。");
      }

      const initialRoom = initialSnap.val();

      if (!initialRoom || initialRoom.status !== "waiting") {
        throw new Error("その部屋は参加受付中ではありません。");
      }

      const initialPlayers = initialRoom.players || {};

      // すでに同じUIDで入室済みなら、そのまま参加成功扱い。
      if (initialPlayers[uid]) {
        return code;
      }

      if (Object.keys(initialPlayers).length >= 6) {
        throw new Error("この部屋は6人で満員です。");
      }

      let failureReason = "";

      // 読み込み後、同時参加による競合だけ transaction で再確認して追加する。
      const result = await roomRef.transaction(room => {
        if (room === null) {
          failureReason = "参加処理中に部屋が閉じられました。";
          return;
        }

        if (room.status !== "waiting") {
          failureReason = "その部屋は参加受付中ではありません。";
          return;
        }

        room.players = room.players || {};

        if (room.players[uid]) {
          return room;
        }

        if (Object.keys(room.players).length >= 6) {
          failureReason = "この部屋は6人で満員です。";
          return;
        }

        const existingOrders = Object.values(room.players)
          .map(p => Number(p && p.joinOrder) || 0);

        const storedNext = Number(room.nextJoinOrder) || 0;
        const maxExisting = existingOrders.length ? Math.max(...existingOrders) : 0;
        const newOrder = Math.max(storedNext, maxExisting) + 1;

        room.nextJoinOrder = newOrder;
        room.players[uid] = roomPlayerData("GUEST", newOrder);

        return room;
      });

      if (!result.committed) {
        throw new Error(failureReason || "部屋への参加に失敗しました。");
      }

      return code;
    }

    async function leaveRoom(code, uid) {
      const roomRef = firebase.database().ref("rooms/" + code);
      let roomDeleted = false;
      let newHostUid = null;

      const result = await roomRef.transaction(room => {
        if (room === null) {
          roomDeleted = true;
          return null;
        }

        room.players = room.players || {};

        if (!room.players[uid]) {
          return room;
        }

        delete room.players[uid];

        const remainingEntries = Object.entries(room.players);

        if (remainingEntries.length === 0) {
          roomDeleted = true;
          return null;
        }

        if (room.hostUid === uid || !room.players[room.hostUid]) {
          remainingEntries.sort((a, b) => {
            const ao = Number(a[1] && a[1].joinOrder) || Number.MAX_SAFE_INTEGER;
            const bo = Number(b[1] && b[1].joinOrder) || Number.MAX_SAFE_INTEGER;
            return ao - bo;
          });

          newHostUid = remainingEntries[0][0];
          room.hostUid = newHostUid;
        }

        return room;
      });

      if (!result.committed && !roomDeleted) {
        throw new Error("退出処理に失敗しました。");
      }

      return { roomDeleted, newHostUid };
    }

    function resetLobbyUI() {
      if (currentRoomRef) {
        currentRoomRef.off();
        currentRoomRef = null;
      }

      currentRoomCode = null;
      currentRoomData = null;

      roomCodeEl.textContent = "------";
      roomBox.classList.remove("show");

      playersList.textContent = "—";
      playersBox.style.display = "none";

      readyBtn.style.display = "none";
      readyBtn.disabled = true;

      startBattleBtn.style.display = "none";
      startBattleBtn.disabled = true;

      leaveRoomBtn.style.display = "none";
      leaveRoomBtn.disabled = true;

      stopCountdown();

      joinCodeInput.value = "";
      createRoomBtn.disabled = false;
      joinRoomBtn.disabled = false;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    async function start() {
      try {
        firebase.initializeApp(firebaseConfig);
        firebaseStatus.textContent = "接続設定 OK";
        firebaseStatus.className = "value status ok";

        firebase.database().ref(".info/serverTimeOffset").on("value", snap => {
          serverTimeOffset = Number(snap.val()) || 0;
        });

        authStatus.textContent = "匿名ログイン中…";
        authStatus.className = "value status warn";

        const credential = await firebase.auth().signInAnonymously();
        const user = credential.user;
        currentUser = user;

        authStatus.textContent = "匿名ログイン成功";
        authStatus.className = "value status ok";
        uidEl.textContent = user.uid;

        createRoomBtn.disabled = false;
        joinRoomBtn.disabled = false;
        setMessage("準備完了。部屋を作るか、6桁番号を入力して参加してください。");

        createRoomBtn.addEventListener("click", async () => {
          createRoomBtn.disabled = true;
          joinRoomBtn.disabled = true;
          setMessage("部屋を作成しています…");

          try {
            const code = await createUniqueRoom(user.uid);
            showRoom(code, "部屋を作成しました。ルームIDを共有して参加者を待ってください。");
          } catch (err) {
            console.error(err);
            setMessage("部屋作成に失敗しました: " + (err && err.message ? err.message : err));
          } finally {
            createRoomBtn.disabled = false;
            joinRoomBtn.disabled = false;
          }
        });

        joinRoomBtn.addEventListener("click", async () => {
          const code = joinCodeInput.value.trim();
          createRoomBtn.disabled = true;
          joinRoomBtn.disabled = true;
          setMessage("部屋へ参加しています…");

          try {
            const joinedCode = await joinRoom(code, user.uid);
            showRoom(joinedCode, "部屋 " + joinedCode + " に参加しました。");
          } catch (err) {
            console.error(err);
            setMessage("参加に失敗しました: " + (err && err.message ? err.message : err));
          } finally {
            createRoomBtn.disabled = false;
            joinRoomBtn.disabled = false;
          }
        });

        copyRoomBtn.addEventListener("click", async () => {
          if (!currentRoomCode) return;

          try {
            await copyText(currentRoomCode);
            setMessage("ルームID " + currentRoomCode + " をコピーしました。");
          } catch (err) {
            console.error(err);
            setMessage("コピーに失敗しました。ルームIDは " + currentRoomCode + " です。");
          }
        });

        leaveRoomBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentUser) return;

          const leavingCode = currentRoomCode;
          leaveRoomBtn.disabled = true;
          readyBtn.disabled = true;
          startBattleBtn.disabled = true;
          setMessage("部屋から退出しています…");

          try {
            const result = await leaveRoom(leavingCode, currentUser.uid);
            resetLobbyUI();

            if (result.roomDeleted) {
              setMessage("退出しました。参加者が0人になったため、部屋 " + leavingCode + " は削除されました。");
            } else if (result.newHostUid) {
              setMessage("退出しました。次の入室者へホストを引き継ぎました。");
            } else {
              setMessage("部屋 " + leavingCode + " から退出しました。");
            }
          } catch (err) {
            console.error(err);
            leaveRoomBtn.disabled = false;
            setMessage("退出に失敗しました: " + (err && err.message ? err.message : err));
          }
        });

        readyBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentRoomData || !currentUser) return;
          if (currentRoomData.status !== "waiting") return;

          const me = currentRoomData.players && currentRoomData.players[currentUser.uid];
          if (!me) return;

          try {
            await firebase.database()
              .ref("rooms/" + currentRoomCode + "/players/" + currentUser.uid + "/ready")
              .set(!me.ready);
          } catch (err) {
            console.error(err);
            setMessage("準備状態の更新に失敗しました。");
          }
        });

        startBattleBtn.addEventListener("click", async () => {
          if (!currentRoomCode || !currentRoomData || !currentUser) return;
          if (!isHost(currentRoomData)) return;
          if (currentRoomData.status !== "waiting") return;
          if (playerCount(currentRoomData) < 2 || playerCount(currentRoomData) > 6) return;
          if (!allPlayersReady(currentRoomData)) return;

          const startAt = Date.now() + serverTimeOffset + 5000;

          try {
            await firebase.database().ref("rooms/" + currentRoomCode).update({
              status: "countdown",
              startAt
            });
            setMessage("開始カウントダウンを送信しました。");
          } catch (err) {
            console.error(err);
            setMessage("開始処理に失敗しました。");
          }
        });

      } catch (err) {
        console.error(err);
        firebaseStatus.textContent = "エラー";
        firebaseStatus.className = "value status bad";
        authStatus.textContent = "失敗";
        authStatus.className = "value status bad";
        setMessage("Firebase初期化または匿名ログインに失敗しました: " + (err && err.message ? err.message : err));
      }
    }

    start();
  </script>
</body>
</html>
